name: Build and Comment APK

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build-and-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment on PR with APK URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifactUrl = "${{ steps.artifact-upload-step.outputs.artifact-url }}";

            const message = `
            ## 📱 確認用APKが生成されました！

            最新のコミットに対するDebug APKがビルドされました。以下のリンクからダウンロードして動作確認を行ってください。

            [📦 APKをダウンロード](${artifactUrl})

            > **Note:** ダウンロードにはGitHubアカウントでのログインが必要です。
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
